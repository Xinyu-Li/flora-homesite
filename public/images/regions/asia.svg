<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="asiaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="asiaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eff6ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#asiaBg)" rx="12"/>

  <g transform="translate(40, 15)">
    <!-- Russia/Northern Asia -->
    <path d="M20,25 L100,15 L180,20 L260,25 L300,35 L310,55 L290,70 L240,75 L180,70 L100,65 L40,55 L15,45 Z"
          fill="url(#asiaGrad)" opacity="0.85"/>

    <!-- China -->
    <path d="M140,75 L200,70 L250,80 L280,100 L275,130 L250,155 L200,165 L150,155 L120,130 L115,100 L125,80 Z"
          fill="url(#asiaGrad)" opacity="0.9"/>

    <!-- India -->
    <path d="M80,110 L120,100 L140,120 L145,150 L130,180 L100,190 L70,175 L55,145 L60,120 Z"
          fill="url(#asiaGrad)" opacity="0.9"/>

    <!-- Southeast Asia -->
    <path d="M170,165 L200,160 L220,175 L225,195 L205,205 L180,200 L165,185 Z"
          fill="url(#asiaGrad)" opacity="0.9"/>

    <!-- Japan -->
    <path d="M300,75 L310,70 L320,80 L325,100 L320,120 L310,130 L300,125 L295,105 L298,85 Z"
          fill="url(#asiaGrad)" opacity="0.9"/>

    <!-- Korea -->
    <path d="M280,90 L292,85 L298,100 L295,118 L285,125 L275,115 L278,100 Z"
          fill="url(#asiaGrad)" opacity="0.9"/>

    <!-- Taiwan -->
    <ellipse cx="285" cy="145" rx="8" ry="12" fill="url(#asiaGrad)" opacity="0.85"/>

    <!-- Indonesia -->
    <ellipse cx="230" cy="200" rx="25" ry="8" fill="url(#asiaGrad)" opacity="0.8"/>
    <ellipse cx="270" cy="195" rx="15" ry="6" fill="url(#asiaGrad)" opacity="0.8"/>
  </g>

  <text x="200" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a">ASIA</text>
</svg>
