<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="oceaniaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="oceaniaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eff6ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#oceaniaBg)" rx="12"/>

  <!-- Australia -->
  <g transform="translate(80, 40)">
    <path d="M50,60 L70,50 L100,45 L130,50 L160,45 L180,55 L190,70 L195,90 L190,110 L180,130 L160,145 L130,150 L100,145 L70,135 L50,120 L40,100 L35,80 L40,65 Z"
          fill="url(#oceaniaGrad)" opacity="0.9"/>
    <!-- Tasmania -->
    <ellipse cx="160" cy="160" rx="12" ry="10" fill="url(#oceaniaGrad)" opacity="0.85"/>
  </g>

  <!-- New Zealand -->
  <g transform="translate(280, 100)">
    <path d="M10,20 L20,10 L30,15 L35,30 L30,50 L20,60 L10,55 L5,40 L8,25 Z"
          fill="url(#oceaniaGrad)" opacity="0.9"/>
    <path d="M25,65 L35,60 L45,70 L40,85 L30,90 L20,80 Z"
          fill="url(#oceaniaGrad)" opacity="0.9"/>
  </g>

  <!-- Pacific Islands -->
  <circle cx="320" cy="60" r="4" fill="url(#oceaniaGrad)" opacity="0.7"/>
  <circle cx="340" cy="75" r="3" fill="url(#oceaniaGrad)" opacity="0.7"/>
  <circle cx="355" cy="55" r="3" fill="url(#oceaniaGrad)" opacity="0.7"/>
  <circle cx="300" cy="80" r="3" fill="url(#oceaniaGrad)" opacity="0.7"/>

  <text x="200" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a">OCEANIA</text>
</svg>
