<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="americasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="americasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eff6ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#americasBg)" rx="12"/>

  <g transform="translate(100, 5)">
    <!-- Canada -->
    <path d="M40,15 L100,10 L160,15 L190,25 L195,45 L180,60 L140,65 L100,60 L60,55 L35,45 L30,30 Z"
          fill="url(#americasGrad)" opacity="0.85"/>

    <!-- USA -->
    <path d="M35,55 L100,50 L160,55 L185,65 L190,85 L175,100 L140,105 L100,100 L60,95 L30,85 L25,70 Z"
          fill="url(#americasGrad)" opacity="0.9"/>

    <!-- Alaska -->
    <path d="M10,30 L30,25 L40,35 L35,50 L20,55 L8,45 Z"
          fill="url(#americasGrad)" opacity="0.85"/>

    <!-- Mexico -->
    <path d="M60,100 L100,95 L120,105 L125,125 L110,140 L85,145 L65,135 L55,115 Z"
          fill="url(#americasGrad)" opacity="0.9"/>

    <!-- Central America -->
    <path d="M95,140 L115,135 L130,145 L135,160 L125,170 L105,165 L95,155 Z"
          fill="url(#americasGrad)" opacity="0.9"/>

    <!-- South America -->
    <path d="M120,170 L155,165 L180,180 L190,210 L175,230 L140,235 L110,225 L100,200 L105,180 Z"
          fill="url(#americasGrad)" opacity="0.9"/>

    <!-- Caribbean -->
    <ellipse cx="155" cy="130" rx="12" ry="6" fill="url(#americasGrad)" opacity="0.8"/>
    <ellipse cx="175" cy="140" rx="8" ry="5" fill="url(#americasGrad)" opacity="0.8"/>
    <circle cx="190" cy="150" r="4" fill="url(#americasGrad)" opacity="0.75"/>
  </g>

  <text x="200" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a">AMERICAS</text>
</svg>
